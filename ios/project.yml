name: MiniAppObservability
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MiniAppObservability:
    type: application
    platform: iOS
    sources:
      - MiniAppObservability
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.miniappobservability
        PRODUCT_NAME: MiniAppObservability
        INFOPLIST_FILE: MiniAppObservability/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NR検証
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
    info:
      path: MiniAppObservability/Info.plist
    scheme:
      testTargets: []
# New Relic iOS agent は Xcode から追加する。
# https://github.com/newrelic/newrelic-ios-agent-spm
