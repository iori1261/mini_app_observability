services:
  api:
    build:
      context: ./apps/backend
    ports:
      # 既定では自分の Mac からしか届かない。/chaos/* を同じ Wi-Fi の他人に
      # 叩かれないようにするため。実機で試すときだけ .env で API_BIND=0.0.0.0 にする。
      - "${API_BIND:-127.0.0.1}:8080:8080"
    environment:
      SERVICE_NAME: api
      PORT: "8080"
      PAYMENTS_URL: http://payments:4000
      # 既定は空（CORS 無効）。ブラウザから試すときだけ .env でオリジンを指定する。
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: mini-app-api
      NEW_RELIC_NO_CONFIG_FILE: "true"
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
      NEW_RELIC_LOG: stdout
    depends_on:
      - payments

  payments:
    build:
      context: ./apps/backend
    environment:
      SERVICE_NAME: payments
      PORT: "4000"
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: mini-app-payments
      NEW_RELIC_NO_CONFIG_FILE: "true"
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
      NEW_RELIC_LOG: stdout
